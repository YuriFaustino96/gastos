workflows:
  ios-adhoc:
    name: iOS AdHoc (IPA)
    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.seu.bundleid.aqui
    scripts:
      - flutter pub get
      - flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa